name: Build Packages

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build application
        run: npm run build
      
      - name: Create Debian package (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev
          mkdir -p dist/debian/DEBIAN
          echo "Package: zink-editor" > dist/debian/DEBIAN/control
          echo "Version: 1.0.0" >> dist/debian/DEBIAN/control
          echo "Architecture: all" >> dist/debian/DEBIAN/control
          echo "Maintainer: " >> dist/debian/DEBIAN/control
          echo "Description: Zink Editor" >> dist/debian/DEBIAN/control
          mkdir -p dist/debian/usr/local/bin
          cp -r dist/* dist/debian/usr/local/bin/
          dpkg-deb --build dist/debian dist/zink-editor.deb
      
      - name: Create Windows installer (Windows)
        if: runner.os == 'Windows'
        run: |
          npm install -g electron-builder
          electron-builder --win --x64 --config electron-builder.yml
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.msi